<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--violet:#8b93ff;--cyan:#56e1e1;--ember:#ff7a45;--ember2:#ffb14e;--text:#eef1f8;--muted:#9aa3b4;--faint:#6a7284;--bg:#07080b}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:2560px;height:1440px;overflow:hidden}
  body{background:var(--bg);position:relative;font-family:'Space Grotesk',sans-serif}
  .cosmos{position:absolute;inset:0;background:
    radial-gradient(1200px 1000px at 82% 8%, rgba(139,147,255,.20), transparent 60%),
    radial-gradient(1000px 900px at 12% 14%, rgba(86,225,225,.11), transparent 62%),
    radial-gradient(1400px 1100px at 55% 122%, rgba(255,122,69,.15), transparent 60%),
    var(--bg);}
  .stars{position:absolute;inset:0;opacity:.5;background-repeat:repeat;background-size:640px 640px;background-image:
    radial-gradient(2px 2px at 80px 120px, rgba(255,255,255,.7), transparent),
    radial-gradient(1.6px 1.6px at 280px 60px, rgba(255,255,255,.5), transparent),
    radial-gradient(1.6px 1.6px at 460px 220px, rgba(255,255,255,.45), transparent),
    radial-gradient(2.2px 2.2px at 560px 400px, rgba(255,255,255,.6), transparent),
    radial-gradient(1.6px 1.6px at 160px 360px, rgba(255,255,255,.4), transparent),
    radial-gradient(1.8px 1.8px at 360px 560px, rgba(255,255,255,.5), transparent),
    radial-gradient(1.5px 1.5px at 60px 520px, rgba(255,255,255,.4), transparent);}
  svg.traj{position:absolute;inset:0}
  .safe{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:44px;text-align:center}
  .mark{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:200px;letter-spacing:-.05em;line-height:1;white-space:nowrap}
  .mark .g{background:linear-gradient(115deg,var(--violet) 15%,var(--cyan) 92%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .mark .dim{color:var(--text)}
  .mark .cur{color:var(--cyan)}
  .tag{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:72px;letter-spacing:.005em}
  .tag .m{color:var(--muted)}
  .tag .f{background:linear-gradient(90deg,var(--ember2),var(--ember));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}
</style></head>
<body>
  <div class="cosmos"></div>
  <div class="stars"></div>
  <svg class="traj" viewBox="0 0 2560 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="arc" x1="400" y1="1150" x2="2200" y2="240" gradientUnits="userSpaceOnUse">
        <stop stop-color="#8b93ff"/><stop offset=".5" stop-color="#ff7a45"/><stop offset="1" stop-color="#56e1e1"/>
      </linearGradient>
      <radialGradient id="well" cx="50%" cy="50%" r="50%">
        <stop stop-color="#8b93ff" stop-opacity=".34"/><stop offset="1" stop-color="#8b93ff" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle cx="410" cy="1150" r="170" fill="url(#well)"/>
    <circle cx="410" cy="1150" r="86" stroke="#2a2f45" stroke-width="2" stroke-dasharray="5 11"/>
    <circle cx="410" cy="1150" r="11" fill="#8b93ff"/>
    <ellipse cx="2190" cy="238" rx="150" ry="42" transform="rotate(-15 2190 238)" stroke="#26314a" stroke-width="2" stroke-dasharray="6 11"/>
    <path d="M410 1150 C 720 1230, 1140 1120, 1560 830 C 1900 590, 2110 360, 2168 268" stroke="url(#arc)" stroke-width="4.6" stroke-linecap="round" opacity=".9"/>
    <circle cx="2168" cy="268" r="22" fill="#56e1e1" opacity=".16"/>
    <circle cx="2168" cy="268" r="11" fill="#56e1e1"/>
  </svg>
  <div class="safe">
    <div class="mark"><span class="g">desh</span><span class="dim">&gt;</span><span class="cur">_</span></div>
    <div class="tag"><span class="m">Not left. Not right.</span> <span class="f">Forward.</span></div>
  </div>
</body></html>
