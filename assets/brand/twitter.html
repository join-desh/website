<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--violet:#8b93ff;--cyan:#56e1e1;--ember:#ff7a45;--ember2:#ffb14e;--text:#eef1f8;--muted:#9aa3b4;--faint:#6a7284;--bg:#07080b}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1500px;height:500px;overflow:hidden}
  body{background:var(--bg);position:relative;font-family:'Space Grotesk',sans-serif}
  .cosmos{position:absolute;inset:0;background:
    radial-gradient(760px 520px at 88% 6%, rgba(139,147,255,.22), transparent 60%),
    radial-gradient(560px 420px at 6% 12%, rgba(86,225,225,.12), transparent 62%),
    radial-gradient(900px 520px at 62% 128%, rgba(255,122,69,.17), transparent 60%),
    var(--bg);}
  .stars{position:absolute;inset:0;opacity:.5;background-repeat:repeat;background-size:500px 500px;background-image:
    radial-gradient(1.6px 1.6px at 60px 90px, rgba(255,255,255,.7), transparent),
    radial-gradient(1.4px 1.4px at 210px 40px, rgba(255,255,255,.5), transparent),
    radial-gradient(1.3px 1.3px at 350px 160px, rgba(255,255,255,.45), transparent),
    radial-gradient(1.8px 1.8px at 430px 300px, rgba(255,255,255,.6), transparent),
    radial-gradient(1.3px 1.3px at 120px 260px, rgba(255,255,255,.4), transparent),
    radial-gradient(1.5px 1.5px at 280px 420px, rgba(255,255,255,.5), transparent),
    radial-gradient(1.2px 1.2px at 40px 400px, rgba(255,255,255,.4), transparent);}
  svg.traj{position:absolute;inset:0}
  .block{position:absolute;left:96px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:26px}
  .mark{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:96px;letter-spacing:-.05em;line-height:1;white-space:nowrap}
  .mark .g{background:linear-gradient(115deg,var(--violet) 15%,var(--cyan) 92%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .mark .dim{color:var(--text)}
  .mark .cur{color:var(--cyan)}
  .tag{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:40px;letter-spacing:.01em}
  .tag .m{color:var(--muted)}
  .tag .f{background:linear-gradient(90deg,var(--ember2),var(--ember));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}
</style></head>
<body>
  <div class="cosmos"></div>
  <div class="stars"></div>
  <svg class="traj" viewBox="0 0 1500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="arc" x1="720" y1="470" x2="1420" y2="80" gradientUnits="userSpaceOnUse">
        <stop stop-color="#8b93ff"/><stop offset=".5" stop-color="#ff7a45"/><stop offset="1" stop-color="#56e1e1"/>
      </linearGradient>
      <radialGradient id="well" cx="50%" cy="50%" r="50%">
        <stop stop-color="#8b93ff" stop-opacity=".38"/><stop offset="1" stop-color="#8b93ff" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle cx="730" cy="452" r="92" fill="url(#well)"/>
    <circle cx="730" cy="452" r="46" stroke="#2a2f45" stroke-width="1.6" stroke-dasharray="4 8"/>
    <circle cx="730" cy="452" r="6.5" fill="#8b93ff"/>
    <ellipse cx="1408" cy="86" rx="96" ry="28" transform="rotate(-16 1408 86)" stroke="#26314a" stroke-width="1.6" stroke-dasharray="5 8"/>
    <path d="M730 452 C 900 486, 1130 430, 1235 300 S 1370 130, 1392 100" stroke="url(#arc)" stroke-width="3.4" stroke-linecap="round" opacity=".92"/>
    <circle cx="1392" cy="100" r="13" fill="#56e1e1" opacity=".18"/>
    <circle cx="1392" cy="100" r="7" fill="#56e1e1"/>
  </svg>
  <div class="block">
    <div class="mark"><span class="dim">#</span><span class="g">desh</span><span class="dim">&gt;</span><span class="cur">_</span></div>
    <div class="tag"><span class="m">Not left. Not right.</span> <span class="f">Forward.</span></div>
  </div>
</body></html>
