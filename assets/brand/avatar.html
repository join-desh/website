<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--violet:#8b93ff;--cyan:#56e1e1;--ember:#ff7a45;--ember2:#ffb14e;--text:#eef1f8;--muted:#9aa3b4;--faint:#6a7284;--bg:#07080b}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1000px;height:1000px;overflow:hidden}
  body{background:var(--bg);position:relative;font-family:'Space Grotesk',sans-serif}
  .cosmos{position:absolute;inset:0;background:
    radial-gradient(720px 620px at 80% 14%, rgba(139,147,255,.22), transparent 60%),
    radial-gradient(640px 560px at 12% 22%, rgba(86,225,225,.13), transparent 62%),
    radial-gradient(840px 720px at 50% 116%, rgba(255,122,69,.18), transparent 60%),
    var(--bg);}
  .stars{position:absolute;inset:0;opacity:.55;background-repeat:repeat;background-size:500px 500px;background-image:
    radial-gradient(1.6px 1.6px at 60px 90px, rgba(255,255,255,.7), transparent),
    radial-gradient(1.4px 1.4px at 210px 40px, rgba(255,255,255,.5), transparent),
    radial-gradient(1.3px 1.3px at 350px 160px, rgba(255,255,255,.45), transparent),
    radial-gradient(1.8px 1.8px at 430px 300px, rgba(255,255,255,.6), transparent),
    radial-gradient(1.3px 1.3px at 120px 260px, rgba(255,255,255,.4), transparent),
    radial-gradient(1.5px 1.5px at 280px 420px, rgba(255,255,255,.5), transparent),
    radial-gradient(1.2px 1.2px at 40px 400px, rgba(255,255,255,.4), transparent);}
  .glow{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:640px;height:640px;border-radius:50%;
    background:radial-gradient(circle, rgba(139,147,255,.16) 0%, transparent 62%)}
  svg.traj{position:absolute;inset:0}
  .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
  .mark{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:172px;letter-spacing:-.05em;line-height:1;white-space:nowrap}
  .mark .g{background:linear-gradient(115deg,var(--violet) 15%,var(--cyan) 90%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .mark .dim{color:var(--text)}
  .mark .cur{color:var(--cyan)}
  .tag{font-family:'JetBrains Mono',monospace;font-size:27px;letter-spacing:.36em;text-transform:uppercase}
  .tag .m{color:var(--faint)}
  .tag .f{background:linear-gradient(90deg,var(--ember2),var(--ember));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}
</style></head>
<body>
  <div class="cosmos"></div>
  <div class="stars"></div>
  <div class="glow"></div>
  <svg class="traj" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="arc" x1="140" y1="880" x2="880" y2="150" gradientUnits="userSpaceOnUse">
        <stop stop-color="#8b93ff"/><stop offset=".5" stop-color="#ff7a45"/><stop offset="1" stop-color="#56e1e1"/>
      </linearGradient>
      <radialGradient id="well" cx="50%" cy="50%" r="50%">
        <stop stop-color="#8b93ff" stop-opacity=".4"/><stop offset="1" stop-color="#8b93ff" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle cx="150" cy="850" r="120" fill="url(#well)"/>
    <circle cx="150" cy="850" r="60" stroke="#2a2f45" stroke-width="2" stroke-dasharray="4 9"/>
    <circle cx="150" cy="850" r="8" fill="#8b93ff"/>
    <ellipse cx="856" cy="150" rx="120" ry="34" transform="rotate(-18 856 150)" stroke="#26314a" stroke-width="2" stroke-dasharray="5 9"/>
    <path d="M150 850 C 330 900, 560 800, 660 560 S 800 250, 820 176" stroke="url(#arc)" stroke-width="4" stroke-linecap="round" opacity=".92"/>
    <circle cx="820" cy="176" r="16" fill="#56e1e1" opacity=".18"/>
    <circle cx="820" cy="176" r="8" fill="#56e1e1"/>
  </svg>
  <div class="center">
    <div class="mark"><span class="dim">#</span><span class="g">desh</span><span class="dim">&gt;</span><span class="cur">_</span></div>
    <div class="tag"><span class="m">Not left. Not right.</span> <span class="f">Forward.</span></div>
  </div>
</body></html>
