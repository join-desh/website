# Site configuration for DESH / joindesh.in
title: "#desh>_ · Corruption is gravity. We're building the rocket."
description: "DESH is a lab building a software-defined political party. We rebuild public services from first principles, for anywhere. Abolishing the gravity of corruption is intractable; we engineer a system that reaches orbit anyway. First test bed: India."
url: "https://joindesh.in"
baseurl: ""
lang: en

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# SEO and social
author: "DESH"
twitter:
  username: joindesh
  card: summary_large_image

# Collections for organized content
collections:
  primitives:
    output: true
    permalink: /primitives/:name/

# Plugins (all supported on GitHub Pages)
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - tools          # collector source; would otherwise be served at /tools/
