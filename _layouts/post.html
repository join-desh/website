---
layout: default
---
<article class="article">
  <div class="container">
    <div class="article-head">
      <a href="/#blog" class="link-arrow back"><span class="arrow">←</span> Decoding Democracy</a>
      <h1>{{ page.title }}</h1>
      <div class="p-meta">
        {% if page.date %}{{ page.date | date: "%B %-d, %Y" }}{% endif %}
        {% if page.meta %} · <span>{{ page.meta }}</span>{% endif %}
      </div>
      {% if page.tags %}
      <div class="tags">
        {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
      </div>
      {% endif %}
    </div>

    <div class="prose">
      {{ content }}
    </div>

    <div style="margin-top:3.5rem;padding-top:2rem;border-top:1px solid var(--border)">
      <a href="/join/" class="btn btn-primary">Join the movement <span class="arrow">→</span></a>
    </div>
  </div>
</article>
